<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
  <title>ラフカ語辞書</title>
  <style>:root {
  --ink: #1c2530; --paper: #f4f6f8; --card: #ffffff; --line: #d8dee5;
  --accent: #274c8f; --accent-bg: #e7eefb; --meta: #66717e;
  --pos: #0f6b5c; --pos-bg: #e2f3ef; --class: #4a4f9b; --class-bg: #e9eafa;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif; font-size: 15px; line-height: 1.7; }
.wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px 64px; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
header h1 { font-size: 21px; margin: 0; letter-spacing: .02em; }
.stat, .grammar-link { font-size: 12px; }
.stat { color: var(--meta); }
.grammar-link { margin-left: auto; }
a { color: var(--accent); }
button, input, select { font: inherit; }
button { cursor: pointer; }
button, select { color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.searchbar { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 6px 0 12px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
#query { width: 100%; min-width: 0; color: var(--ink); background: var(--card); font-size: 17px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; font-family: "SF Mono", Consolas, "Noto Sans Mono", monospace; }
#query:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.opts { display: flex; gap: 10px 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: #3d4652; }
.opts label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.opts fieldset { border: none; margin: 0; padding: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.opts legend { float: left; padding: 0 6px 0 0; color: var(--meta); font-size: 12px; }
.opts input { margin: 0; accent-color: var(--accent); }
.opts select { max-width: 190px; font-size: 13px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
#reset, #clear-tag { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); padding: 2px 10px; }
#reset { margin-left: auto; }
.result-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--meta); margin: 0 2px 8px; }
#count { font-size: 13px; margin: 0; }
#shuffle { padding: 3px 12px; font-size: 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--card); }
#shuffle:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
#shuffle:disabled { opacity: .35; cursor: default; }
.entry { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; overflow-wrap: anywhere; }
.entry-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
.entry h2 { margin: 0; font-size: 18px; font-family: "SF Mono", Consolas, monospace; color: var(--accent); }
.conjbtn { font-size: 11.5px; color: var(--accent); background: var(--accent-bg); border: 1px solid #cddcf5; border-radius: 99px; padding: 1px 10px; }
.conjbtn:hover { background: #d8e5fa; }
.conjbtn[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tags { display: flex; flex-wrap: wrap; gap: 3px 5px; margin: 0 0 4px; }
.tag { border: none; border-radius: 5px; padding: 0 5px; font-size: 12px; line-height: 1.7; color: var(--class); background: var(--class-bg); }
.tag.pos { color: var(--pos); background: var(--pos-bg); }
.tag:hover { text-decoration: underline; }
.meaning { margin: 0; white-space: pre-wrap; }
.etym { margin: 2px 0 0; font-size: 12px; color: var(--meta); }
.forms { margin: 8px 0 4px; padding: 10px 14px; background: #f8fafb; border: 1px solid var(--line); border-radius: 8px; }
.forms h3 { margin: 12px 0 4px; font-size: 13px; font-weight: 600; }
.forms h3:first-child { margin-top: 0; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 14px; width: 100%; }
th { text-align: left; font-weight: 400; color: var(--meta); padding: 2px 14px 2px 0; white-space: nowrap; vertical-align: top; font-size: 12px; }
thead th { border-bottom: 1px solid var(--line); }
td { padding: 3px 14px 3px 0; vertical-align: top; }
td:last-child { padding-right: 0; }
.cell-value { font-family: "SF Mono", Consolas, monospace; }
.relations { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 12px; color: var(--meta); margin-top: 4px; }
.relation { border: none; padding: 0; background: none; font-family: "SF Mono", Consolas, monospace; font-size: 13px; color: var(--accent); text-decoration: underline; }
.empty { padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font-size: 13px; }
.pager { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px; margin: 18px 0; font-size: 13px; }
#pager-top { margin: 4px 0 10px; }
.pager button { min-width: 34px; height: 36px; padding: 0 8px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pager button:disabled { opacity: .35; cursor: default; }
.pager button[aria-current="page"], .pager button[aria-current="page"]:hover { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.pager .gap { color: var(--meta); padding: 0 2px; }
@media (max-width: 560px) {
  .wrap { padding: 16px 12px 40px; }
  header { gap: 4px 12px; margin-bottom: 8px; }
  header h1 { font-size: 20px; }
  .searchbar { position: static; }
  .panel { padding: 12px; }
  .opts { gap: 8px 12px; }
  .opts fieldset { gap: 6px 10px; }
  .entry { padding: 12px 14px; }
  .forms { padding: 8px 10px; }
}
/* Editing controls stay out of the reading view. */
textarea { font: inherit; }
#edit-mode, .editor-toolbar button, .entry-edit-controls button, .editor-dialog button { border: 1px solid var(--line); border-radius: 6px; background: var(--card); padding: 4px 10px; font-size: 13px; }
#edit-mode { font-size: 12px; padding: 1px 9px; }
.editor-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.edit-status { font-size: 13px; margin: 4px 0; width: 100%; overflow-wrap: anywhere; }
.entry-edit-controls { display: flex; gap: 8px; margin-top: 8px; }
.entry-edit-controls:empty { display: none; }
.editor-dialog { width: min(760px, calc(100% - 24px)); max-height: calc(100dvh - 32px); padding: 20px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: var(--card); overflow: auto; }
.editor-dialog::backdrop { background: #1c253080; }
.editor-dialog h2 { font-size: 19px; margin: 0 0 12px; }
.editor-dialog h3 { font-size: 15px; margin: 20px 0 8px; }
.editor-dialog input, .editor-dialog select, .editor-dialog textarea { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 5px; background: white; color: var(--ink); padding: 6px 8px; }
.editor-dialog input { font-family: "SF Mono", Consolas, monospace; }
.editor-dialog label { display: block; font-size: 13px; }
.editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.editor-grid .wide { grid-column: 1 / -1; }
.editor-dialog textarea { display: block; resize: vertical; }
.editor-actions { display: flex; flex-wrap: wrap; gap: 10px; position: sticky; bottom: -20px; padding: 16px 0; background: white; border-top: 1px solid var(--line); margin-top: 20px; }
.editor-actions .danger { color: #a72020; margin-left: auto; }
.editor-dialog button.primary { background: var(--accent); color: white; border-color: var(--accent); }
.editor-dialog button:disabled, .editor-toolbar button:disabled { opacity: .45; cursor: default; }
.edit-error { color: #a22b2b; font-size: 13px; margin: 0 0 10px; }
.edit-error:empty { display: none; }
.edit-table { min-width: 0; border: 1px solid var(--line); padding: 10px; margin: 10px 0; border-radius: 6px; }
.edit-table legend { font-size: 12px; color: var(--meta); }
.edit-table-heading { display: flex; gap: 8px; margin-bottom: 12px; }
.edit-table-heading button { flex-shrink: 0; }
.form-edit-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 7px; margin-bottom: 7px; align-items: start; }
.form-edit-row input:first-child { font-family: inherit; font-size: 13px; }
.change-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.relation-edit-row { display: grid; grid-template-columns: minmax(90px, .7fr) minmax(0, 2fr) auto; gap: 7px; align-items: start; margin-bottom: 12px; }
.relation-picker { min-width: 0; }
.relation-popup { margin-top: 4px; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: white; }
.relation-options { max-height: 240px; overflow-y: auto; overscroll-behavior: contain; }
.editor-dialog .relation-option { display: block; width: 100%; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); padding: 9px 10px; text-align: left; overflow-wrap: anywhere; }
.editor-dialog .relation-option:hover, .editor-dialog .relation-option[aria-selected=true] { background: #eaf0fb; }
.relation-option-title { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.relation-option-title strong { font-size: 15px; }
.relation-pos, .relation-meaning, .relation-status { font-size: 12px; color: var(--meta); }
.relation-meaning { display: block; margin-top: 3px; }
.relation-status { margin: 0; padding: 7px 10px; }
#owner-login { width: min(460px, calc(100% - 24px)); }
#owner-login p { font-size: 13px; }
#owner-login label { margin-top: 16px; }
#owner-login button { margin-right: 8px; }
#changes-dialog > button { margin: 8px 8px 0 0; }
@media (max-width: 560px) {
  .editor-dialog { padding: 14px; }
  .editor-grid { grid-template-columns: 1fr; }
  .editor-actions { bottom: -14px; }
  .form-edit-row { grid-template-columns: minmax(0, 1fr) auto; }
  .form-edit-row input:first-child { grid-column: 1; }
  .form-edit-row input:nth-child(2), .form-edit-row select { grid-column: 1; grid-row: 2; }
  .form-edit-row button { grid-column: 2; grid-row: 1 / 3; }
  .relation-edit-row { grid-template-columns: minmax(0, 1fr) auto; }
  .relation-edit-row > select { grid-column: 1; grid-row: 1; }
  .relation-picker { grid-column: 1 / -1; grid-row: 2; }
  .relation-edit-row > button { grid-column: 2; grid-row: 1; }
}

.form-edit-row:has(button:nth-child(4)) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto auto; }
@media (max-width: 560px) {
  .form-edit-row:has(button:nth-child(4)) { grid-template-columns: minmax(0, 1fr) auto; }
  .form-edit-row button:nth-child(3) { grid-row: 1; }
  .form-edit-row button:nth-child(4) { grid-row: 2; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ラフカ語辞書</h1>
    <span class="stat" id="stat"></span>
    <a class="grammar-link" href="ラフカ語文法.pdf">文法</a>
  </header>
  <main>
    <div class="searchbar"><form id="search-form" class="panel" role="search">
      <input id="query" type="search" placeholder="単語・訳語を入力" aria-label="検索語" autocomplete="off" spellcheck="false">
      <div class="opts">
        <fieldset><legend>対象</legend>
          <label><input type="radio" name="scope" value="both" checked>見出し語＋訳語</label>
          <label><input type="radio" name="scope" value="head">見出し語</label>
          <label><input type="radio" name="scope" value="trans">訳語</label>
          <label><input type="radio" name="scope" value="full">全文</label>
        </fieldset>
        <fieldset><legend>方式</legend>
          <label><input type="radio" name="mode" value="prefix">前方一致</label>
          <label><input type="radio" name="mode" value="partial" checked>部分一致</label>
          <label><input type="radio" name="mode" value="exact">完全一致</label>
        </fieldset>
      </div>
      <div class="opts">
        <label><input id="useinfl" type="checkbox" checked>変化形も探す</label>
      </div>
      <div class="opts filters">
        <label>項目 <select id="kind"><option value="">すべて</option><option>単語</option><option>接辞</option><option>慣用句</option></select></label>
        <label id="pos-filter">品詞 <select id="pos"><option value="">すべて</option></select></label>
        <label id="numeral-filter">数詞 <select id="numeral"><option value="">指定なし</option><option value="all">すべての数詞</option><option>基数</option><option>序数</option></select></label>
        <label id="gender-filter" hidden>性 <select id="gender" disabled><option value="">すべて</option><option value="M">男性</option><option value="F">女性</option><option value="N">中性</option></select></label>
        <label id="class-filter" hidden>分類 <select id="class" disabled><option value="">すべて</option></select></label>
        <button type="button" id="reset">リセット</button>
      </div>
    </form></div>
    <div class="result-bar"><p id="count" role="status" aria-live="polite"></p><button id="shuffle" type="button">シャッフル</button><span id="active-tag"></span><button id="clear-tag" hidden>タグ解除</button></div>
    <nav id="pager-top" class="pager" aria-label="検索結果のページ（上）"></nav>
    <div id="results"></div>
    <nav id="pager-bottom" class="pager" aria-label="検索結果のページ（下）"></nav>
  </main>
  <noscript>検索と語形表の表示にはJavaScriptを有効にしてください。</noscript>
</div>

  $('numeral').disabled = !hasNumeral;
  if (!hasNumeral) $('numeral').value = '';
  const noun = pos === '名詞';

}
$('stat').textContent = DATA.entries.length.toLocaleString() + ' 項目';
function clearHash() {
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
function reset() {

  syncFilters();

  tag = '';
  page = 0;
  clearHash();
}
function chooseTag(value, pos = $('pos').value) {
  if (value) {

    if (['接辞', '接頭辞', '接尾辞'].includes(value)) $('kind').value = '接辞';

    $('class').value = '';

function tableView(table) {
  const wrapper = node('div', undefined, 'table-wrap'), el = node('table'), head = node('thead'), hr = node('tr');
  el.setAttribute('aria-label', table.title);
  hr.append(node('th', '区分'));
  table.columns.forEach(c => { const th = node('th', c); th.scope = 'col'; hr.append(th); });
  head.append(hr);
  el.append(head);
  const body = node('tbody');
  for (const row of table.rows) {
    const tr = node('tr'), th = node('th', row.label);
    th.scope = 'row';
    tr.append(th);
    for (const f of row.cells) {
      const td = node('td');
      td.append(node('span', f.value, 'cell-value'));
      tr.append(td);
    }

  }

  card.id = 'entry-' + e.id;

  heading.append(node('h2', e.head));
  if (e.tables.length) {
    const toggle = node('button', e.pos === '動詞' ? '活用' : '曲用', 'conjbtn');
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-controls', 'forms-' + e.id);
    const details = node('div', undefined, 'forms');
    details.id = 'forms-' + e.id;
    details.hidden = !open;
    toggle.addEventListener('click', () => {
      details.hidden = !details.hidden;
      toggle.setAttribute('aria-expanded', String(!details.hidden));

  nav.hidden = pages <= 1;

  for (let n = start; n <= Math.min(pages, start + 2); n++) numbers.add(n);
  if (pages <= 7) for (let n = 1; n <= pages; n++) numbers.add(n);

    const b = node('button', text);
    b.type = 'button';
    b.dataset.page = target - 1;
    b.disabled = disabled;

      if (target === current) b.setAttribute('aria-current', 'page');

  const mode = document.querySelector('input[name="mode"]:checked').value;
  $('useinfl').disabled = scope === 'trans';
  const id = location.hash.startsWith('#word=') ? location.hash.slice(6) : '';

      && (!$('kind').value || e.kind === $('kind').value)
      && (!$('pos').value || e.pos === $('pos').value)

  $('results').replaceChildren(...matched.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE).map(e => entryView(e, Boolean(id))));

}
function changed() {
  page = 0;
  clearHash();
  render();
}
$('query').addEventListener('input', changed);
$('search-form').addEventListener('change', e => {
  if (['pos', 'kind'].includes(e.target.id)) {
    $('gender').value = '';
    $('class').value = '';
    tag = '';
    syncFilters();
  }
  if (e.target.id !== 'query') changed();
});
$('search-form').addEventListener('submit', e => { e.preventDefault(); changed(); });
$('reset').addEventListener('click', () => { reset(); render(); $('query').focus(); });
$('clear-tag').addEventListener('click', () => chooseTag(''));
$('shuffle').addEventListener('click', () => {
  order = [...index];
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  page = 0;
  render();
});
for (const id of ['pager-top', 'pager-bottom']) $(id).addEventListener('click', e => {
  const button = e.target.closest('button[data-page]');
  if (!button || button.disabled) return;
  page = Number(button.dataset.page);
  render();
  $('pager-top').querySelector('[aria-current="page"]').focus({preventScroll: true});
  window.scrollTo({top: 0, behavior: 'smooth'});
});
window.addEventListener('hashchange', () => { page = 0; render(); });
syncFilters();
render();

    formsTitle.textContent=p==='動詞'?'活用':'曲用';
    for(const input of [pattern,oblique])showField(input,noun);
    showField(pronounPattern,p==='代名詞');
    for(const input of [present,impersonal,gerund])showField(input,p==='動詞');
    showField(strong,p==='動詞'&&cls.value!=='母音幹');
    for(const input of [adjStem,femaleStem,neuterStem,neuterForm])showField(input,p==='形容詞');
    for(const option of pattern.options)option.disabled=option.value.startsWith('plural-')&&number.value!=='plural';
    if(pattern.selectedOptions[0]?.disabled)pattern.value='auto';
    if (!noun) {gender.value='';number.value='';}
    else if (!gender.value) gender.value='M';
    if (numeral.disabled) numeral.value='';
  }
  function controlsEntry() {
    return {...working,head:head.value.trim().normalize('NFC'),kind:kind.value,pos:pos.value,gender:gender.disabled?'':gender.value,class:cls.disabled?'':cls.value,numberRestriction:number.disabled?'':number.value,numeralType:numeral.disabled?'':numeral.value};
  }
  function writeSettings(){
    for(const [key,input] of Object.entries(settingInputs))input.value=model.settings[key]||(key==='nounPattern'?'auto':key==='pronounPattern'?'none':'');
    impersonal.value=model.settings.impersonal?'yes':'';gerund.value=model.settings.gerundDeclension?'yes':'';
  }
  function readSettings(){
    for(const [key,input] of Object.entries(settingInputs))if(!input.disabled){const v=input.value.trim().normalize('NFC').replace(/-$/,'');if(v)model.settings[key]=v;else delete model.settings[key];}
    if(pos.value==='動詞'){model.settings.impersonal=impersonal.value==='yes';model.settings.gerundDeclension=gerund.value==='yes';}
  }
  function autocomplete(redraw=true){
    if(!model)return;
    automaticError='';
    try{
      readSettings();M.validate(model);
      const e=controlsEntry();
      if(e.head){const result=M.update(e,model,previousGenerated);working.tables=result.tables;previousGenerated=result.generated;}
    }catch(error){automaticError=error.message;}
    errors.textContent=automaticError;
    if(redraw)drawTables();
  }
  function changePos(){
    syncEditor(true);extra.value='';working.tables=[];delete working.inflection;
    model={version:1,settings:{nounPattern:'auto',gerundDeclension:pos.value==='動詞'},overrides:{},omitted:[]};
    previousGenerated=[];writeSettings();autocomplete();
  }
  pos.addEventListener('change',changePos);
  kind.addEventListener('change',()=>{if(kind.value==='接辞')pos.value='';else if(!pos.value)pos.value='名詞';changePos();});
  cls.addEventListener('change',()=>{for(const key of ['obliqueStem','strongStem','presentStem'])delete model.settings[key];writeSettings();syncEditor();autocomplete();});
  for(const input of [gender,number,numeral])input.addEventListener('change',()=>{syncEditor();autocomplete();});
  head.addEventListener('input',()=>{if(pos.value==='形容詞'&&head.value.trim())cls.value=/[aeiouäöü]$/.test(head.value.trim())?'母音幹':'子音幹';autocomplete();});
  for(const input of Object.values(settingInputs))input.addEventListener(input.tagName==='SELECT'?'change':'input',()=>autocomplete());
  for(const input of [impersonal,gerund])input.addEventListener('change',()=>autocomplete());
  function omit(label){if(!label.trim())return;if(!model.omitted.includes(label))model.omitted.push(label);delete model.overrides[label];}
  function flattenTable(t, filter=()=>true) {const values=E.forms({tables:[t]}).filter(filter);t.columns=['語形'];t.rows=values.map(f=>({label:f.label,cells:[f]}));}
  function textInput(value,label,onInput) {const input=node('input');input.type='text';input.value=value;input.required=true;input.setAttribute('aria-label',label);input.addEventListener('input',()=>onInput(input.value));return input;}
  function drawTables() {
    tables.replaceChildren();
    working.tables.forEach((t,ti)=>{
      const group=node('fieldset',undefined,'edit-table'); const legend=node('legend','表 '+(ti+1));
      const top=node('div',undefined,'edit-table-heading');top.append(textInput(t.title,'表の名前',v=>t.title=v),button('表を削除',()=>{M.forms({tables:[t]}).forEach(f=>omit(f.label));working.tables.splice(ti,1);drawTables();}));
      group.append(legend,top);
      // Keep the original table's shape; values and their grammatical labels are editable.
      t.rows.forEach(r=>r.cells.forEach(f=>{
        const row=node('div',undefined,'form-edit-row');
        row.append(textInput(f.label,'語形名',v=>{omit(f.label);f.label=v;flattenTable(t);}),textInput(f.value,f.label || '語形',v=>{f.value=v;if(f.label.trim()&&M.forms({tables:previousGenerated}).some(x=>x.label===f.label)){if(v.trim())model.overrides[f.label]=v;else delete model.overrides[f.label];}}),button('削除',()=>{omit(f.label);flattenTable(t,x=>x!==f);if(!t.rows.length)working.tables.splice(ti,1);drawTables();}));
        row.children[1].addEventListener('change',()=>autocomplete());
        if(Object.hasOwn(model.overrides,f.label)){
          const reset=button('自動',()=>{delete model.overrides[f.label];autocomplete();});reset.setAttribute('aria-label',f.label+'を自動補完に戻す');row.append(reset);
        }
        group.append(row);
      }));
      group.append(button('語形を追加',()=>{flattenTable(t);t.rows.push({label:'',cells:[{label:'',value:''}]});drawTables();}));
      tables.append(group);
    });
  }
  function relationPicker(r) {
    const picker=node('div',undefined,'relation-picker'),input=node('input'),popup=node('div',undefined,'relation-popup');
    const list=node('div',undefined,'relation-options'),status=node('p','','relation-status'),id='relation-'+randomId();
    input.type='text';input.required=true;input.autocomplete='off';input.spellcheck=false;input.placeholder='見出し語・意味で検索';
    input.setAttribute('role','combobox');input.setAttribute('aria-label','関連語');input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-controls',id);input.setAttribute('aria-expanded','false');input.setAttribute('aria-describedby',id+'-status');
    list.id=id;list.setAttribute('role','listbox');list.setAttribute('aria-label','関連語の候補');status.id=id+'-status';status.setAttribute('role','status');
    const label=e=>e.head+'（'+(e.pos||e.kind)+'）';
    const selected=DATA.entries.find(e=>e.id===r.id);input.value=selected?label(selected):'';
    let matches=[],active=-1,composing=false;
    function hide(){popup.hidden=true;input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');active=-1;}
    function highlight(index){
      active=index;[...list.children].forEach((option,i)=>option.setAttribute('aria-selected',String(i===active)));
      const option=list.children[active];if(option){input.setAttribute('aria-activedescendant',option.id);option.scrollIntoView({block:'nearest'});}
    }
    function choose(e){r.id=e.id;r.head=e.head;input.value=label(e);input.setCustomValidity('');input.focus();hide();}
    function suggest(){
      if(composing)return;
      const query=normalize((r.id?r.head:input.value).trim());list.replaceChildren();active=-1;input.removeAttribute('aria-activedescendant');
      if(!query){matches=[];status.textContent='';hide();return;}
      const terms=query.split(/\s+/);
      const found=DATA.entries.filter(e=>e.id!==working.id).map(e=>({e,head:normalize(e.head),text:normalize(e.head+' '+e.meaning)}))
        .filter(x=>terms.every(t=>x.text.includes(t)));
      const rank=x=>x.head===query?0:x.head.startsWith(query)?1:x.head.includes(query)?2:3;
      found.sort((a,b)=>rank(a)-rank(b));matches=found.slice(0,20).map(x=>x.e);
      matches.forEach((e,i)=>{
        const option=button('',()=>choose(e),'relation-option');option.tabIndex=-1;option.id=id+'-'+i;option.setAttribute('role','option');option.setAttribute('aria-selected','false');
        const title=node('span',undefined,'relation-option-title');title.append(node('strong',e.head),node('span',e.pos||e.kind,'relation-pos'));
        option.append(title,node('span',e.meaning,'relation-meaning'));list.append(option);
      });
      status.textContent=found.length>20?found.length+' 件中20件を表示。続けて入力すると絞り込めます。':found.length?found.length+' 件':'候補がありません。';
      popup.hidden=false;input.setAttribute('aria-expanded','true');
    }
    input.addEventListener('input',()=>{r.id='';r.head='';input.setCustomValidity('候補から関連語を選んでください。');if(!composing)suggest();});
    input.addEventListener('focus',suggest);
    input.addEventListener('compositionstart',()=>{composing=true;hide();});
    input.addEventListener('compositionend',()=>{composing=false;suggest();});
    input.addEventListener('keydown',event=>{
      if(composing||event.isComposing||event.keyCode===229)return;
      if(event.key==='ArrowDown'||event.key==='ArrowUp'){
        event.preventDefault();if(popup.hidden)suggest();if(matches.length)highlight(active<0?(event.key==='ArrowDown'?0:matches.length-1):Math.max(0,Math.min(matches.length-1,active+(event.key==='ArrowDown'?1:-1))));
      }else if(event.key==='Enter'){
        event.preventDefault();if(!popup.hidden&&matches.length)choose(matches[Math.max(0,active)]);
      }else if(event.key==='Escape'&&!popup.hidden){event.preventDefault();event.stopPropagation();hide();}
    });
    // Keep keyboard focus on the combobox while clicking a candidate.
    list.addEventListener('mousedown',event=>event.preventDefault());
    picker.addEventListener('focusout',()=>{setTimeout(()=>{if(!picker.contains(document.activeElement))hide();},0);});
    popup.append(list,status);picker.append(input,popup);hide();return picker;
  }
  function appendRelation(r){
    const row=node('div',undefined,'relation-edit-row');
    const type=node('select');type.setAttribute('aria-label','関係');
    const choices=[...E.RELATION_TYPES];if(!choices.includes(r.title))choices.push(r.title);
    for(const value of choices){const option=node('option',value);option.value=value;type.append(option);}type.value=r.title;
    type.addEventListener('change',()=>{r.title=type.value;});
    row.append(type,relationPicker(r),button('削除',()=>{working.relations.splice(working.relations.indexOf(r),1);row.remove();}));relations.append(row);return row;
  }
  function drawRelations(){relations.replaceChildren();working.relations.forEach(appendRelation);}
  function extraTags(e) {const standard=E.tags({...e,tags:[]},[]);return e.tags.filter(t=>!standard.includes(t));}
  function openEditor(id, duplicate=false) {
    if(!ownerToken)return;
    const existing=DATA.entries.find(e=>e.id===id);
    working=existing?E.clone(existing):{id:randomId(),head:'',pos:'名詞',kind:'単語',numeralType:'',numberRestriction:'',gender:'M',class:'固定型',meaning:'',tags:[],protoForms:[],relations:[],tables:[]};
    model=existing&&!duplicate?M.infer(working):{version:1,settings:{nounPattern:'auto',gerundDeclension:working.pos==='動詞'},overrides:{},omitted:[]};
    try{previousGenerated=M.generate(working,model.settings,model.overrides);}catch{previousGenerated=[];}
    if(duplicate){working.id=randomId();working.head='';working.relations=[];working.tables=[];delete working.inflection;previousGenerated=[];}
    openingChange=E.clone(draft.changes.find(c=>E.changeId(c)===working.id)||null);
    remove.hidden=!existing||duplicate;
    head.value=working.head;kind.value=working.kind;pos.value=working.pos;gender.value=working.gender;
    number.value=working.numberRestriction;numeral.value=working.numeralType;meaning.value=working.meaning;proto.value=working.protoForms.join('\n');extra.value=extraTags(working).join('、');
    syncEditor();cls.value=working.class;
    writeSettings();syncEditor();autocomplete(false);
    errors.textContent=automaticError;drawTables();drawRelations();$('entry-editor-title').textContent=existing&&!duplicate?'語彙を編集':'語彙を追加';
    editor.showModal();head.focus();initialForm=formSnapshot();
  }
  function randomId(){return [...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('');}
  function formSnapshot(){return JSON.stringify([working,model,[...form.querySelectorAll('input,textarea,select')].map(i=>i.value)]);}
  function closeEditor(){if(formSnapshot()!==initialForm&&!confirm('入力中の変更を破棄しますか？'))return;editor.close();}
  editor.addEventListener('cancel',e=>{e.preventDefault();closeEditor();});
  function readDraft(){const text=localStorage.getItem(KEY);return text?E.validateDraft(JSON.parse(text)):{version:1,changes:[]};}
  function persist(next){requireOwner();next=E.materializeDraft(published,next);localStorage.setItem(KEY,JSON.stringify(next));draft=next;refresh();}
  function refresh(){DATA.entries=ownerToken?E.applyDraft(published,draft):E.clone(published);refreshIndex();notice.textContent=draft.changes.length?draft.changes.length+' 件の未公開の変更（この端末に保存済み）':'';manage.disabled=!draft.changes.length;backup.disabled=!draft.changes.length;}
  function fail(error){if(!ownerToken)return;notice.textContent=error.message;render();}
  function deleteEntry(){
    try{
      requireOwner();
      const target=DATA.entries.find(e=>e.id===working.id);
      if(!target)throw new Error('この語は既に削除されています。');
      if(!confirm('「'+target.head+'」を削除しますか？ この語への関連リンクも削除します。'))return;
      const latest=readDraft(),current=latest.changes.find(c=>E.changeId(c)===working.id)||null;
      if(!E.equal(current,openingChange))throw new Error('別のタブでこの語を編集しています。開き直してください。');
      persist(E.deleteDraft(published,latest,working.id));editor.close();reset();render();
      if(draft.changes.length)showChanges();
    }catch(error){errors.textContent=error.message;}
  }
  form.addEventListener('submit',event=>{
    event.preventDefault();errors.textContent='';
    try{
      requireOwner();
      autocomplete(false);if(automaticError)throw new Error(automaticError);
      const e={...working,head:head.value.trim().normalize('NFC'),kind:kind.value,pos:pos.value,gender:gender.disabled?'':gender.value,class:cls.disabled?'':cls.value,numberRestriction:number.disabled?'':number.value,numeralType:numeral.disabled?'':numeral.value,meaning:meaning.value.trim(),protoForms:proto.value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>s.startsWith('*')?s:'*'+s)};
      let extraValues=extra.value.split(/[、,]/).map(t=>t.trim()).filter(Boolean);
      if(e.pos==='名詞'){
        extraValues=extraValues.filter(t=>!['子音幹','母音幹'].includes(t)&&!/^-[aeiouäöü]幹$/.test(t));
        const p=M.nounPattern(e,model.settings);extraValues.push(p==='glide'?'母音幹':['consonant','aq'].includes(p)?'子音幹':'-'+({a:'a',o:'o','plural-a':'a','plural-i':'i'}[p]||e.head.slice(-1))+'幹');
      }
      if(e.pos==='形容詞'){
        extraValues=extraValues.filter(t=>!['中性ウムラウト型','男性・中性同形型','語幹短縮型','語末子音交替'].includes(t));
        const f=M.map(e),s=model.settings.adjectiveStem||(e.head.endsWith('q')||e.head.endsWith('nk')?e.head.slice(0,-1)+'g':e.head.endsWith('k')?e.head.slice(0,-1)+'c':e.head);
        extraValues.push(f['中性単数主格']===e.head?'男性・中性同形型':'中性ウムラウト型');
        if(model.settings.femaleStem&&model.settings.femaleStem!==s&&!/[aeiouäöü]$/.test(e.head))extraValues.push('語幹短縮型');
        if(/[qk]$/.test(e.head))extraValues.push('語末子音交替');
      }
      if(e.pos==='動詞'){extraValues=extraValues.filter(t=>t!=='無主語');if(model.settings.impersonal)extraValues.push('無主語');}
      e.tags=E.tags(e,extraValues);
      if(['名詞','動詞','形容詞','代名詞'].includes(e.pos))e.inflection=E.clone(model);else delete e.inflection;
      if(E.equal([...e.tags].sort(),[...working.tags].sort()))e.tags=E.clone(working.tags);
      E.validate(e);E.apply(DATA.entries,[e]);
      const latest=readDraft(), current=latest.changes.find(c=>E.changeId(c)===e.id)||null;
      if(!E.equal(current,openingChange))throw new Error('別のタブでこの語を編集しています。入力を控え、開き直してください。');
      persist(E.updateDraft(published,latest,e));editor.close();showEntry(e.id);
      if(event.submitter!==saveDraft)showChanges();
    }catch(error){errors.textContent=error.name==='QuotaExceededError'?'端末に保存する空き容量がありません。入力内容を控えてください。':error.message;}
  });
  const changesDialog=dialog('changes-dialog','未公開の変更を公開'), changesList=node('div'), publishStatus=node('p','','edit-status');publishStatus.setAttribute('role','status');publishStatus.id='publish-status';
  const publish=button('公開する',publishDraft,'primary');publish.id='publish-edits';
  const close=button('閉じる',()=>changesDialog.close());
  changesDialog.append(changesList,publishStatus,publish,close);
  let publishing=false;
  changesDialog.addEventListener('cancel',e=>{if(publishing)e.preventDefault();});
  function showChanges(){
    if(!ownerToken)return;
    changesList.replaceChildren();publishStatus.replaceChildren();
    for(const c of draft.changes){const row=node('div',undefined,'change-row'),entry=c.after||c.before;row.append(node('span',entry.head+'（'+(!c.after?'削除':c.before?'編集':'追加')+'）'));
      if(c.after)row.append(button('編集',()=>{changesDialog.close();openEditor(entry.id);}));
      row.append(button('変更を取り消す',()=>{
        if(!confirm(entry.head+' の未公開の変更を取り消しますか？'))return;
        try{persist(E.revertDraft(published,readDraft(),entry.id));showChanges();}catch(e){publishStatus.textContent=e.message;}
      }));changesList.append(row);}
    publish.disabled=!draft.changes.length;
    if(!changesDialog.open)changesDialog.showModal();
  }
  async function publishDraft(){
    if(!ownerToken)return;
    const changes=E.clone(draft.changes);publishing=true;
    [...changesDialog.querySelectorAll('button')].forEach(b=>b.disabled=true);
    try{
      const result=await LafcaGitHub.publish(changes,ownerToken,m=>publishStatus.textContent=m);
      if(!ownerToken)return;
      // Retain any edits made in other tabs while the request was in flight.
      const latest=readDraft();latest.changes=latest.changes.filter(c=>!changes.some(sent=>E.equal(sent,c)));
      published=E.clone(result.entries);persist(latest);
      publishStatus.replaceChildren(node('span','GitHubに保存しました。公開ページへの反映には少し時間がかかります。 '));
      const a=node('a','保存した変更');a.href=result.url;a.target='_blank';a.rel='noopener noreferrer';publishStatus.append(a);
      changesList.replaceChildren();
    }catch(error){if(error.code==='AUTH'){logout();showLogin(error.message);}else publishStatus.textContent=error.message;}
    finally{publishing=false;[...changesDialog.querySelectorAll('button')].forEach(b=>b.disabled=false);publish.disabled=!draft.changes.length;}
  }
  function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=node('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  importInput.addEventListener('change',async()=>{
    try{
      requireOwner();
      const file=importInput.files[0];if(!file)return;if(file.size>10_000_000)throw new Error('ファイルが大きすぎます。');
      const imported=E.validateDraft(JSON.parse(await file.text())),latest=readDraft();
      for(const c of imported.changes){const old=latest.changes.find(x=>E.changeId(x)===E.changeId(c));if(old&&!E.equal(old,c))throw new Error('この端末の変更と重複しています：'+(c.after||c.before).head);if(!old)latest.changes.push(c);}
      E.applyDraft(published,latest);persist(latest);
    }catch(e){fail(e);}finally{importInput.value='';}
  });
  window.addEventListener('storage',event=>{if(ownerToken&&event.key===KEY){try{draft=readDraft();refresh();}catch(e){fail(e);}}});
  window.lafcaEditControls=e=>{const controls=node('div',undefined,'entry-edit-controls');if(ownerToken&&editing)controls.append(button('編集',()=>openEditor(e.id)),button('複製して追加',()=>openEditor(e.id,true)));return controls;};
  refresh();
})();
</script>
